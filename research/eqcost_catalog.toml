[equipment.heat_exchanger_u_tube]
name = "Shell-and-tube heat exchanger (U-tube)"
size_unit = "m2 (area)"
k = [4.1884, -0.2503, 0.1974]
size_range = [10.0, 1000.0]
b = [1.63, 1.66]
pressure_c = [0.03881, -0.11272, 0.08183]
pressure_range = [5.0, 140.0]
[equipment.heat_exchanger_u_tube.fm]
CS = 1.00
SS = 2.73
Ni_alloy = 3.73
