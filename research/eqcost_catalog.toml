# Bundled default costing data (Turton bare-module method).
#
# This file is the single source of truth for equipment correlations, material
# factors, and the CEPCI index. Override it with `eqcost ... --config <path>`.
# All constants are tied to CEPCI = 397 (year 2001), Turton's correlation basis.
#
# Equipment entries support two bare-module models:
#   factor  — set `b = [B1, B2]` and `fm` holds material *factors*; an optional
#             `pressure_c = [C1, C2, C3]` over `pressure_range` gives Fp.
#   direct  — omit `b`; `fm` holds the bare-module factor F_BM directly per
#             material (e.g. compressors). No pressure factor.

[cepci]
base_year = 2001
# Chemical Engineering Plant Cost Index, annual averages (interpolated between).
2001 = 397.0
2018 = 603.1
2019 = 607.5
2020 = 596.2
2021 = 708.8
2022 = 816.0
2023 = 797.9
2024 = 800.0

# --- equipment ---------------------------------------------------------------

[equipment.pump_centrifugal]
name = "Centrifugal pump"
size_unit = "kW (shaft power)"
k = [3.3892, 0.0536, 0.1538]
size_range = [1.0, 300.0]
b = [1.89, 1.35]
pressure_c = [-0.3935, 0.3957, -0.00226]
pressure_range = [10.0, 100.0]
[equipment.pump_centrifugal.fm]
cast_iron = 1.00
CS = 1.60
SS = 2.30
Ni_alloy = 4.40

[equipment.heat_exchanger]
